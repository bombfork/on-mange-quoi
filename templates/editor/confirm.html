{% extends "base.html" %}

{% block content %}
{% include "editor/nav.html" %}
<h2>{{ heading }}</h2>
<p>{{ help }}</p>
{% if !items.is_empty() %}
<ul>
  {% for item in items %}
  <li>{{ item }}</li>
  {% endfor %}
</ul>
{% endif %}
<form method="post" action="{{ action }}">
  {% for field in fields %}
  <input type="hidden" name="{{ field.name }}" value="{{ field.value }}" />
  {% endfor %}
  <button type="submit">{{ confirm_label }}</button>
</form>
<p><a href="{{ cancel_url }}">{{ t.editor.cancel }}</a></p>
{% endblock %}
