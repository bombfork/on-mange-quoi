<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ t.app.title }}</title>
    <link rel="stylesheet" href="/assets/pico.min.css" />
    <link rel="stylesheet" href="/assets/main.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1><a href="/" class="contrast">{{ t.app.title }}</a></h1>
        <p>{{ t.app.tagline }}</p>
        <nav>
          <ul>
            <li><a href="/">{{ t.nav.menu }}</a></li>
            <li><a href="/cook">{{ t.nav.cook }}</a></li>
            <li><a href="/catalog/recipes">{{ t.nav.catalog }}</a></li>
          </ul>
        </nav>
      </header>
      {% if !catalog_errors.is_empty() %}
      <article class="catalog-errors">
        <p><strong>{{ t.layout.catalog_errors }}</strong></p>
        <ul>
          {% for error in catalog_errors %}
          <li><small>{{ error }}</small></li>
          {% endfor %}
        </ul>
      </article>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
