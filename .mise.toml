[tools]
rust = "stable"
"cargo:cargo-edit" = "latest"
"github:bombfork/releaser" = "latest"

[tasks.dev]
description = "Serve a copy of the example catalog (target/dev-catalog) on http://localhost:8080"
run = """
[ -d target/dev-catalog ] || { mkdir -p target && cp -r examples/catalog target/dev-catalog; }
cargo run -- --catalog target/dev-catalog --port 8080
"""

[tasks.fmt]
description = "Format code"
run = "cargo fmt"

[tasks."fmt:check"]
description = "Check code formatting"
run = "cargo fmt --check"

[tasks.lint]
description = "Run clippy and fix warnings"
run = "cargo clippy --all-targets --fix --allow-dirty --allow-staged"

[tasks."lint:check"]
description = "Check for clippy warnings"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.build]
description = "Build the project"
run = "cargo build"

[tasks.test]
description = "Run tests"
run = "cargo test"

[tasks."deps:update"]
description = "Update Rust dependencies"
run = "cargo upgrade --incompatible && cargo update"

[tasks.check]
description = "Run all checks (format, lint, build, test)"
depends = ["fmt:check", "lint:check", "build", "test"]

[tasks.schemas]
description = "Regenerate the JSON Schemas of the catalog files in schemas/"
run = "cargo test --lib schemas_are_up_to_date"
env = { UPDATE_SCHEMAS = "1" }

[tasks.release]
description = "Releases are automated via releaser (merge the releaser/pending-release PR)"
run = '''
echo "Releases are automated: merge the 'releaser/pending-release' PR on GitHub."
echo "Preview the next release locally with: releaser release --dry-run"
'''
