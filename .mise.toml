[tools]
node = "24"

[tasks.install]
description = "Install npm dependencies from the lockfile"
run = "npm ci"

[tasks.dev]
description = "Serve the app on http://localhost:8000 (no caching)"
run = "npx http-server -p 8000 -c-1"

[tasks.lint]
description = "Run oxlint"
run = "npm run lint"

[tasks.format]
description = "Check formatting with oxfmt"
run = "npm run format"

[tasks.format-fix]
description = "Fix formatting with oxfmt"
run = "npm run format:fix"

[tasks.validate-i18n]
description = "Validate locale files against locales/schema.json"
run = "npm run validate:i18n"

[tasks.test-unit]
description = "Run unit tests (node --test)"
run = "npm run test:unit"

[tasks.validate-all]
description = "Run all checks (lint, format, i18n, unit tests)"
run = "npm run validate:all"
